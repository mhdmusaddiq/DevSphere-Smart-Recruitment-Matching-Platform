<div class="seeker-shell">
  <aside class="sidebar" [class.sidebar--open]="menuOpen()" aria-label="Job Seeker workspace">
    <a class="brand" routerLink="/seeker/dashboard" aria-label="AptLens seeker dashboard">
      <apt-brand-wordmark />
    </a>

    <div class="workspace-card">
      <span>Workspace</span>
      <strong>Job Seeker</strong>
    </div>

    <nav aria-label="Job Seeker navigation">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          (click)="closeMenu()"
        >
          <apt-app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <p class="sidebar-note">Keep your factual career evidence current before applying.</p>
  </aside>

  @if (menuOpen()) {
    <button type="button" class="backdrop" aria-label="Close Job Seeker menu" (click)="closeMenu()"></button>
  }

  <section class="main-column">
    <header class="topbar">
      <button
        type="button"
        class="menu-button"
        aria-label="Open Job Seeker menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <apt-app-icon name="menu" [size]="20" />
      </button>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <span>Job Seeker</span><span aria-hidden="true">/</span><strong>{{ currentPageName() }}</strong>
      </nav>
      <apt-account-menu />
    </header>

    <main class="route-content">
      <router-outlet />
    </main>
  </section>
</div>
