@if (transportErrors.failure(); as failure) {
  <section class="transport-banner" role="alert" aria-live="assertive">
    <apt-app-icon [name]="failure.kind === 'throttled' ? 'clock' : 'warning'" [size]="20" />
    <div>
      <strong>{{ failure.kind === 'throttled' ? 'Please wait before trying again' : 'The service could not complete that action' }}</strong>
      <span>{{ failure.message }}</span>
      @if (failure.retryAfterSeconds) {
        <small>Try again in about {{ failure.retryAfterSeconds }} seconds.</small>
      }
    </div>
    <button type="button" (click)="transportErrors.clear()" aria-label="Dismiss service message">
      <apt-app-icon name="close" [size]="18" />
    </button>
  </section>
}

<router-outlet />
